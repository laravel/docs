name: Notify the site

# The translation ships inside the application image as a submodule, so a merge
# here is not live until the site repository moves its pointer and redeploys.
# This tells it to. The site also polls daily, so a missed dispatch delays the
# update rather than losing it.
#
# Requires two repository settings:
#
#   SITE_DISPATCH_TOKEN (secret)  a PAT with Contents: read and write on the
#                                 site repository. The default GITHUB_TOKEN
#                                 cannot reach another repository.
#   SITE_REPOSITORY (variable)    owner/name of the site repository. A variable
#                                 rather than a literal so moving the site
#                                 between accounts or into the organisation is
#                                 a settings change, not a code change.

on:
  push:
    branches: [13.x]
    paths: ['**.md']
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE: ${{ vars.SITE_REPOSITORY }}
        run: |
          if [ -z "$SITE" ]; then
            echo 'SITE_REPOSITORY is not set - skipping.' \
                 'The site polls daily, so the update is delayed, not lost.'
            exit 0
          fi

          gh api "repos/$SITE/dispatches" \
            --field event_type=docs-updated \
            --field 'client_payload[commit]=${{ github.sha }}'
